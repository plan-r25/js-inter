<script>
  "use strict";

  let user = {
    name: "John",
    surname: "Smith",
  };

  //this is how we create for accessor property
  Object.defineProperty(user, 'fullName', {
    get() {
      return `${this.name} ${this.surname}`;
    },

    set(value) {
      [this.name, this.surname] = value.split(" ");
    }
  });

  //this is how we create for data property
  /*
  Object.defineProperty(user, 'fullName', {
     value: "plan r",
     writable: true,
     enumerable: true,
     configurable: true
  })
  */
  user.fullName = 'plan r';
  // alert(user.fullName);
  // for (let key in user) alert(key);

  let user1 = {
    // _name: "plan",
    get name() {
      return this._name;
    },

    set name(value) {
      if (value.length < 4) {
        alert("Name is too short, need at least 4 characters");
        return;
      }
      this._name = value;
    }
  };

  user1.name = "thhe";
  // alert(user1.name);

  function User(name, birthday) {
    this.name = name;
    this.birthday = birthday;

    Object.defineProperty(this, 'age', {
      get() {
        let todayYear = new Date().getFullYear();
        return todayYear - this.birthday.getFullYear();
      }
    });
  }

  let john = new User("john", new Date(1999, 7, 7));

  alert(john.birthday);
  alert(john.age);
</script>
